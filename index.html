<!DOCTYPE html>
    <html>
    <head>
        <title>Audio Pipeline Interface</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                color: #333;
            }
            
            .container {
                max-width: 1200px;
                margin: 0 auto;
                background: rgba(255, 255, 255, 0.95);
                border-radius: 20px;
                padding: 30px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.1);
                backdrop-filter: blur(10px);
            }
            
            h1 {
                text-align: center;
                color: #4a5568;
                margin-bottom: 30px;
                font-size: 2.5em;
                font-weight: 300;
            }
            
            .controls {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-bottom: 30px;
            }
            
            .btn {
                padding: 15px 30px;
                border: none;
                border-radius: 50px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            
            .btn-primary {
                background: linear-gradient(45deg, #667eea, #764ba2);
                color: white;
            }
            
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            }
            
            .btn-danger {
                background: linear-gradient(45deg, #ff6b6b, #ee5a24);
                color: white;
            }
            
            .btn-danger:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
            }
            
            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
            }
            
            .status {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
            }
            
            .status-card {
                background: white;
                padding: 20px;
                border-radius: 15px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
                border-left: 4px solid #667eea;
            }
            
            .status-card h3 {
                margin: 0 0 10px 0;
                color: #4a5568;
                font-size: 1.1em;
            }
            
            .status-value {
                font-size: 1.5em;
                font-weight: 600;
                color: #667eea;
            }
            
            .conversation {
                background: white;
                border-radius: 15px;
                padding: 20px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
                max-height: 400px;
                overflow-y: auto;
            }
            
            .message {
                margin: 15px 0;
                padding: 15px;
                border-radius: 15px;
                animation: fadeIn 0.3s ease;
            }
            
            .message.user {
                background: linear-gradient(45deg, #667eea, #764ba2);
                color: white;
                margin-left: 20%;
            }
            
            .message.assistant {
                background: #f7fafc;
                border: 1px solid #e2e8f0;
                margin-right: 20%;
            }
            
            .message.system {
                background: #fff5f5;
                border: 1px solid #fed7d7;
                text-align: center;
                font-style: italic;
                color: #c53030;
            }
            
            .timing-info {
                font-size: 0.8em;
                opacity: 0.7;
                margin-top: 5px;
            }
            
            .recording-indicator {
                display: none;
                position: fixed;
                top: 20px;
                right: 20px;
                background: #ff4757;
                color: white;
                padding: 10px 20px;
                border-radius: 25px;
                animation: pulse 1s infinite;
                z-index: 1000;
            }
            
            .recording-indicator.active {
                display: block;
            }
            
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            
            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.05); }
                100% { transform: scale(1); }
            }
            
            .progress-bar {
                width: 100%;
                height: 4px;
                background: #e2e8f0;
                border-radius: 2px;
                overflow: hidden;
                margin: 10px 0;
            }
            
            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #667eea, #764ba2);
                width: 0%;
                transition: width 0.3s ease;
            }
        </style>
    </head>
<body>
    <div class="container">
        <h1>🎤 Audio Pipeline Interface</h1>
        <div class="controls">
            <button id="startBtn" class="btn btn-primary">Start Listening</button>
            <button id="stopBtn" class="btn btn-danger" disabled>Stop Listening</button>
        </div>
        <div class="status">
            <div class="status-card">
                <h3>Connection Status</h3>
                <div id="connectionStatus" class="status-value">Disconnected</div>
            </div>
            <div class="status-card">
                <h3>ASR Latency</h3>
                <div id="asrLatency" class="status-value">-</div>
            </div>
            <div class="status-card">
                <h3>LLM Latency</h3>
                <div id="llmLatency" class="status-value">-</div>
            </div>
            <div class="status-card">
                <h3>TTS Latency</h3>
                <div id="ttsLatency" class="status-value">-</div>
            </div>
        </div>
        <div class="conversation" id="conversation">
            <div class="message system">
                Welcome! Click "Start Listening" to begin voice conversation.
            </div>
        </div>
    </div>
    <div id="recordingIndicator" class="recording-indicator">
        🎤 Recording...
    </div>
      <script>
        let ws = null;
        let audioContext = null;
        let isRecording = false;
        let currentAudio = null;
        let playbackSources = []; // TRACK ALL SOURCES

        // Audio queue variables
        let audioQueue = [];
        let isPlayingQueue = false;
        let nextPlayTime = 0;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const conversation = document.getElementById('conversation');
        const recordingIndicator = document.getElementById('recordingIndicator');

        function addMessage(type, content, timing = null) {
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.innerHTML = content;
            if (timing) {
                const timingDiv = document.createElement('div');
                timingDiv.className = 'timing-info';
                timingDiv.textContent = timing;
                message.appendChild(timingDiv);
            }
            conversation.appendChild(message);
            conversation.scrollTop = conversation.scrollHeight;
        }

        function updateStatus(elementId, value) {
            document.getElementById(elementId).textContent = value;
        }

        function stopAllAudioPlayback() {
            // Stop and clear all currently playing AudioBufferSourceNodes
            playbackSources.forEach(src => {
                try { src.stop(); } catch(e) {}
            });
            playbackSources = [];
            
            // Clear the audio queue
            audioQueue = [];
            isPlayingQueue = false;
            nextPlayTime = 0;
            
            if (currentAudio) {
                try { currentAudio.pause(); } catch(e) {}
                currentAudio = null;
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`ws://127.0.0.1:8000/ws`);

            ws.onopen = function() {
                updateStatus('connectionStatus', 'Connected');
                startBtn.disabled = false;
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            ws.onclose = function() {
                updateStatus('connectionStatus', 'Disconnected');
                startBtn.disabled = true;
                stopBtn.disabled = true;
                stopAllAudioPlayback();
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                updateStatus('connectionStatus', 'Error');
                stopAllAudioPlayback();
            };
        }

        function handleMessage(data) {
            switch(data.type) {
                case 'connected':
                    addMessage('system', data.message);
                    break;

                case 'speech_detected':
                    recordingIndicator.classList.add('active');
                    stopAllAudioPlayback(); // Stop any TTS playback immediately!
                    break;

                case 'speech_ended':
                    recordingIndicator.classList.remove('active');
                    break;

                case 'asr_result':
                    updateStatus('asrLatency', `${data.latency_ms.toFixed(1)}ms`);
                    if (data.text) {
                        addMessage('user', data.text, 
                            `Confidence: ${(data.average_probability * 100).toFixed(1)}%`);
                    }
                    break;

                case 'llm_result':
                    updateStatus('llmLatency', `${data.latency_ms.toFixed(1)}ms`);
                    if (!data.low_confidence) {
                        addMessage('assistant', data.response);
                    }
                    break;

                case 'tts_first_chunk':
                    updateStatus('ttsLatency', `${data.latency_ms.toFixed(1)}ms`);
                    // Initialize queue for new TTS response
                    if (!isPlayingQueue) {
                        initializeAudioQueue();
                    }
                    break;

                case 'audio_chunk':
                    queueAudioChunk(data.audio_data, data.sample_rate);
                    break;

                case 'response_cancelled':
                    addMessage('system', 'Response cancelled - new speech detected');
                    stopAllAudioPlayback();
                    break;

                case 'tts_cancelled':
                    stopAllAudioPlayback();
                    break;

                case 'error':
                    addMessage('system', `Error: ${data.message}`);
                    stopAllAudioPlayback();
                    break;
            }
        }

        function initializeAudioQueue() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            // Reset queue state
            audioQueue = [];
            isPlayingQueue = true;
            nextPlayTime = audioContext.currentTime;
        }

        function queueAudioChunk(audioData, sampleRate) {
            try {
                // Convert base64 to audio buffer
                const binaryString = atob(audioData);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const int16Array = new Int16Array(bytes.buffer);
                
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                const audioBuffer = audioContext.createBuffer(1, int16Array.length, sampleRate);
                const channelData = audioBuffer.getChannelData(0);
                for (let i = 0; i < int16Array.length; i++) {
                    channelData[i] = int16Array[i] / 32768.0;
                }

                // Add to queue instead of playing immediately
                audioQueue.push({
                    buffer: audioBuffer,
                    duration: audioBuffer.duration
                });

                // Start playing if this is the first chunk
                if (audioQueue.length === 1 && isPlayingQueue) {
                    playNextInQueue();
                }

            } catch (error) {
                console.error('Error processing audio chunk:', error);
            }
        }

        function playNextInQueue() {
            if (!isPlayingQueue || audioQueue.length === 0) {
                return;
            }

            const audioItem = audioQueue.shift();
            const source = audioContext.createBufferSource();
            source.buffer = audioItem.buffer;
            source.connect(audioContext.destination);

            // Calculate when to start this chunk
            const startTime = Math.max(audioContext.currentTime, nextPlayTime);
            source.start(startTime);
            
            // Update next play time
            nextPlayTime = startTime + audioItem.duration;

            // Track the source for cleanup
            playbackSources.push(source);

            // Set up to play next chunk when this one ends
            source.onended = () => {
                playbackSources = playbackSources.filter(s => s !== source);
                
                // Play next chunk if queue is still active
                if (isPlayingQueue) {
                    playNextInQueue();
                } else if (audioQueue.length === 0) {
                    // Queue is finished
                    isPlayingQueue = false;
                    nextPlayTime = 0;
                }
            };

            // Handle case where source is stopped before ending naturally
            const originalStop = source.stop.bind(source);
            source.stop = function(...args) {
                playbackSources = playbackSources.filter(s => s !== source);
                originalStop(...args);
            };

        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true
                    } 
                });

                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const source = audioContext.createMediaStreamSource(stream);
                const processor = audioContext.createScriptProcessor(8192, 1, 1);

                processor.onaudioprocess = function(e) {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const audioData = new Float32Array(inputData);
                        // Convert to base64
                        const buffer = new ArrayBuffer(audioData.length * 4);
                        const view = new Float32Array(buffer);
                        view.set(audioData);
                        const base64 = btoa(String.fromCharCode(...new Uint8Array(buffer)));
                        ws.send(JSON.stringify({
                            type: 'audio',
                            data: base64
                        }));
                    }
                };

                source.connect(processor);
                processor.connect(audioContext.destination);

                isRecording = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;

                // Store references for cleanup
                window.audioStream = stream;
                window.audioProcessor = processor;
                window.audioSource = source;

            } catch (error) {
                console.error('Error starting recording:', error);
                addMessage('system', 'Error: Could not access microphone');
            }
        }

        function stopRecording() {
            if (window.audioStream) {
                window.audioStream.getTracks().forEach(track => track.stop());
            }
            if (window.audioProcessor) {
                window.audioProcessor.disconnect();
            }
            if (window.audioSource) {
                window.audioSource.disconnect();
            }
            isRecording = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            recordingIndicator.classList.remove('active');
        }

        startBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);

        // Initialize connection
        connectWebSocket();
    </script>      
    </body>
    </html>
